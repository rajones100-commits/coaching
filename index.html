<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>My Calendar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">PERSONAL DASHBOARD</p>
        <h1>My Calendar</h1>
        <p id="todayLabel" class="muted"></p>
      </div>
      <button id="refreshBtn" class="refresh-btn" type="button" aria-label="Refresh calendar">↻ Refresh</button>
    </header>

    <main>
      <section class="stats" aria-label="Calendar summary">
        <article class="stat-card">
          <span class="stat-label">Today</span>
          <strong id="todayCount">0</strong>
          <span>appointments</span>
        </article>
        <article class="stat-card">
          <span class="stat-label">Next 7 days</span>
          <strong id="weekCount">0</strong>
          <span>appointments</span>
        </article>
        <article class="stat-card next-card">
          <span class="stat-label">Next appointment</span>
          <strong id="nextTitle">Nothing scheduled</strong>
          <span id="nextWhen">—</span>
        </article>
      </section>

      <nav class="tabs" aria-label="Calendar views">
        <button class="tab active" data-view="today">Today</button>
        <button class="tab" data-view="week">Next 7 Days</button>
        <button class="tab" data-view="month">Month</button>
        <button class="tab" data-view="all">All Upcoming</button>
      </nav>

      <section class="toolbar">
        <label class="search-wrap">
          <span class="sr-only">Search appointments</span>
          <input id="searchInput" type="search" placeholder="Search appointments, locations or notes…">
        </label>
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="">All categories</option>
        </select>
      </section>

      <section id="status" class="status">Loading calendar…</section>
      <section id="calendarList" class="calendar-list" aria-live="polite"></section>
    </main>

    <footer>
      <span>Calendar data from Google Sheets</span>
      <span id="lastUpdated"></span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
